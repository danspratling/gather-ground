name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Astro build
        run: npm run build
        env:
          SANITY_PROJECT_ID: mrz1ftls
          SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test -- --project=chromium
        env:
          SANITY_PROJECT_ID: mrz1ftls
          SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

  component-tests:
    name: Component Tests (Storybook)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Storybook build
        run: npm run build-storybook
        env:
          IS_STORYBOOK_BUILD: 'true'

      - name: Astro component + a11y tests (happy-dom)
        run: npm run test-storybook:astro

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # Audits the deployed Vercel preview, which only exists for PRs.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Wait for Vercel preview deployment
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const maxWaitMs = 600_000;
            const pollMs = 10_000;
            const deadline = Date.now() + maxWaitMs;
            while (Date.now() < deadline) {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner, repo, ref: sha, per_page: 100,
              });
              const vercel = data.find(s => s.context === 'Vercel' && s.state === 'success');
              if (vercel?.target_url) {
                core.setOutput('url', vercel.target_url);
                console.log(`Vercel preview ready: ${vercel.target_url}`);
                return;
              }
              const failed = data.find(s => s.context === 'Vercel' && s.state === 'failure');
              if (failed) {
                core.setFailed('Vercel deployment failed — skipping Lighthouse audit');
                return;
              }
              console.log('Waiting for Vercel status check…');
              await new Promise(r => setTimeout(r, pollMs));
            }
            core.setFailed('Timed out waiting for Vercel preview deployment');

      - name: Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_BASE_URL: ${{ steps.vercel.outputs.url }}
