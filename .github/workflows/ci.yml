name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Astro build
        run: npm run build
        env:
          SANITY_PROJECT_ID: mrz1ftls
          SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test -- --project=chromium
        env:
          SANITY_PROJECT_ID: mrz1ftls
          SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

  component-tests:
    name: Component Tests (Storybook)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Storybook build
        run: npm run build-storybook
        env:
          IS_STORYBOOK_BUILD: 'true'

      - name: Astro component + a11y tests (happy-dom)
        run: npm run test-storybook:astro

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Build (node adapter)
        run: npm run build
        env:
          SANITY_PROJECT_ID: mrz1ftls
          SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          PUBLIC_COMMERCE_ENABLED: 'true'
          CI_LIGHTHOUSE: 'true'
          CI: 'true'

      - name: Start preview server
        run: PORT=4321 node dist/server/entry.mjs &

      - name: Wait for preview server
        run: npx --yes wait-on http://localhost:4321 --timeout 60000

      - name: Lighthouse
        run: node scripts/lighthouse.mjs
