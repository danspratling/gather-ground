name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chromatic:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Chromatic to detect changed stories

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Publish to Chromatic
        run: npx chromatic --build-script-name build-storybook
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          IS_STORYBOOK_BUILD: 'true'
        continue-on-error: false
