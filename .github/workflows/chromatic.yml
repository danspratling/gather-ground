name: Chromatic

on:
  push:
    branches:
      - '**'

jobs:
  chromatic:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for Chromatic to detect changed stories

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          UNTITLEDUI_TOKEN: ${{ secrets.UNTITLEDUI_TOKEN }}

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          # Auto-accept changes on main so baseline is always kept up to date.
          # PRs still require review/approval via the Chromatic UI.
          autoAcceptChanges: main
          # Don't block CI waiting for snapshot results on PRs — Chromatic
          # reports status asynchronously via the GitHub check.
          exitOnceUploaded: true
          # Only snapshot stories affected by git changes since the last build.
          # Not compatible with pull_request triggers (uses ephemeral merge commit);
          # running on push for all branches avoids that issue.
          onlyChanged: true
        env:
          IS_STORYBOOK_BUILD: 'true'
